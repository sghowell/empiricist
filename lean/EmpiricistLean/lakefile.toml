name = "EmpiricistLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["EmpiricistLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# This is a downstream MIT-licensed project, not a mathlib contribution: the
# mathlibStandardSet header linter insists on mathlib's own Apache-2.0 copyright
# wording, which doesn't apply here.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "EmpiricistLean"
# `EmpiricistLean.Foundation` (the promoted Fable-authored fusion lower bound) is a
# self-contained trusted-foundation module. It DELIBERATELY re-proves
# `Empiricist.fusion_cost_lower_bound` / `components_merge_bound` under the same
# names FusionCost.lean owns, so it cannot be imported into the aggregate root
# alongside FusionCost (name collision). It is instead built as its own first-class
# library module via this glob, so `lake build EmpiricistLean` produces its olean
# without importing it into the root.
globs = ["EmpiricistLean", "EmpiricistLean.Foundation", "EmpiricistLean.LocalComp", "EmpiricistLean.FusionRule", "EmpiricistLean.TreeThm", "EmpiricistLean.DoubleStar", "EmpiricistLean.CenterMerge", "EmpiricistLean.TrueTwin", "EmpiricistLean.ProducibleExt"]

# Compiled axiom-audit driver: the SOLE axiom authority for the FORMALIZED trust
# gate (M8 soundness fix). Only imports `Lean`, so it builds in seconds; the
# untrusted mathlib-importing source is elaborated at RUNTIME via the frontend.
[[lean_exe]]
name = "axiom_audit"
root = "AxiomAudit"
# The driver runs the real Lean frontend on untrusted source at runtime, which
# needs the interpreter to execute imported elaborators / `native_decide` /
# `#eval`. Without this the frontend fails with "Could not find native
# implementation" / "elaboration function ... has not been implemented".
supportInterpreter = true
