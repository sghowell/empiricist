[project]
name = "empiricist"
version = "0.1.0"
description = "A lightweight epistemic-ledger harness for the FT-FBQC open problems"
requires-python = ">=3.11"
dependencies = [
    "blake3>=1.0",
    "psutil>=6.0",
    "pydantic>=2.0",
    "stim>=1.16",
    "networkx>=3.0",
    "pynauty>=2.8",
    "numpy>=2.0",
]

[project.scripts]
empiricist = "empiricist.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
# SDP-solve dependencies for the SEARCH side of the M20c certificate pipeline
# (certificates/solve.py). Quarantined here (NOT a main dependency, NOT in
# `dev`) so the trust-boundary checker (certificates/core.py, stdlib-only)
# and the rest of the harness never require cvxpy/scs. Install with:
#   uv sync --group certs
certs = [
    "cvxpy>=1.4",
    "scs>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empiricist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: exhaustive/long-running tests (deselect with -m 'not slow')",
    "slow_lean: invokes real lake/lean on the pinned EmpiricistLean project (deselect with -m 'not slow_lean'; skipped automatically if the project isn't built)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
