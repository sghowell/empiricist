[project]
name = "empiricist"
version = "0.1.0"
description = "A lightweight epistemic-ledger harness for the FT-FBQC open problems"
requires-python = ">=3.11"
dependencies = [
    "blake3>=1.0",
    "psutil>=6.0",
    "pydantic>=2.0",
    "stim>=1.16",
    "networkx>=3.0",
    "pynauty>=2.8",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empiricist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
