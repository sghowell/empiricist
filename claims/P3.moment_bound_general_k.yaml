statement: 'For two dual-rail qubits in one of the four Bell states (one photon in
  each of two disjoint rail pairs), an ancilla of exactly k >= 0 photons on further
  disjoint modes in a normalized state (pure or mixed) independent of the Bell label,
  one fixed passive interferometer U in U(m) for any number of modes m, photon-number-resolving
  detection of all output modes with no adaptivity, and any unambiguous assignment
  of the detection patterns: the average success (1/4) sum_B p_B is at most (k+1)/(k+2);
  hence min_B p_B <= (k+1)/(k+2) and 1 - p*(k) >= 1/(k+2) under both metrics.'
