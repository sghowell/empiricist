statement: For every k >= 0, every number of modes m, every passive interferometer
  U in U(m), every ancilla state of exactly k photons on the ancilla modes, photon-number-resolving
  detection of all output modes, and every unambiguous assignment, the average success
  (1/4) sum_B p_B is at most (k+1)/(k+2); hence min_B p_B <= (k+1)/(k+2) and 1 - p*(k)
  >= 1/(k+2) under both metrics.
