  (no U in U(4) identifies all four Bell states, so min_B p_B = 0 at m = 4).

  The witness''s validity is on record twice: p3_k0_min_zero validates the exact isometry
  (columns exactly orthonormal in Q(i)(sqrt d), k = 0) before deciding the predicate,
  and the companion claim P3.k0_m8_exact_witness carries a p3_exact_witness PASS on
  the same evidence file (exact success (1/4, 1/4, 1/4, 1/4), every Bell state identified).

