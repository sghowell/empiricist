statement: 'One-body unambiguous-discrimination lemma (two qubits, Bell basis): for
  unit vectors a, b in C^2, real numbers s_A, s_B, c, and real numbers lambda_B indexed
  by the four Bell states B, if s_A|a><a| (x) I + s_B I (x) |b><b| + c I - sum_B lambda_B
  |B><B| equals W W^dagger for some complex 4x4 matrix W (that is, is positive semidefinite),
  then sum_B lambda_B <= s_A + s_B + 4c. Exact SOS certificate over 47 real variables;
  the bound is attained at a = b = |0>, s_A = s_B.'
