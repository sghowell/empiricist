statement: 'One-body unambiguous-discrimination lemma (two qubits): let |phi+-> =
  (|00> +- |11>)/sqrt2 and |psi+-> = (|01> +- |10>)/sqrt2 be the four Bell states
  B. For unit vectors a, b in C^2, real numbers s_A, s_B, c, and real numbers lambda_B
  (one for each Bell state B), if s_A |a><a| (x) I + s_B I (x) |b><b| + c I - sum_B
  lambda_B |B><B| = W W^dagger for some complex 4x4 matrix W, then sum_B lambda_B
  <= s_A + s_B + 4c.'
