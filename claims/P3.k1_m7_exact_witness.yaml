  with k=1 ancilla photon(s) on 7 modes (an isometry over the 4 dual-rail input modes
  and 1 ancilla input mode(s)) whose exact per-Bell-state success vector is (phi+,
  phi-, psi+, psi-) = (1/2, 2/9, 1, 1/6); hence the problem's p*(1) = sup min_B p_B
  is at least 1/6, and the literature's average-success analogue sup mean_B p_B is
  at least 17/36 (exact evaluation in Q(i)(sqrt d)). Every Bell state is identified
  with positive probability.
