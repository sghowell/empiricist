statement: For every passive interferometer U in U(5) acting on the dual-rail Bell
  pair (qubit A on modes 1-2, qubit B on modes 3-4) and one ancilla photon in mode
  5, with photon-number-resolving detection of all five output modes, and for every
  unambiguous assignment of the three-photon detection patterns (each pattern mapped
  to a Bell state or to failure, a pattern mapped to a Bell state B having zero probability
  under the other three Bell states), the average success (1/4) sum_B p_B is at most
  2/3; consequently min_B p_B <= 2/3.
