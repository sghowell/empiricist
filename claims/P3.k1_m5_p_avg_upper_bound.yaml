statement: 'For every passive interferometer U in U(5) acting on the dual-rail Bell
  pair (modes 1-4) and one ancilla photon in mode 5, with photon-number-resolving
  detection, and for every unambiguous assignment of the three-photon detection patterns,
  the average success (1/4) sum_B p_B is at most 2/3; hence the problem''s p = min_B
  p_B is at most 2/3 as well (photon-number moment bound: the one-body USD lemma plus
  the moment identity checked exactly at m = 5).'
