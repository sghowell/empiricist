statement: 'The 12-rule system R0core = {fusion, fusion_x, identity_z, identity_x,
  identity_z_h, identity_x_h, identity_z_hh, identity_x_hh, loop_z, loop_x, loop_z_h,
  loop_x_h}, oriented left-to-right, is terminating under the lexicographic measure
  (vertices, edges) and locally confluent within depth 4 at residual arity <= 2 over
  the stabilizer phases (formulation p6-zx-v1, section 3): every one of its 2388 critical
  pairs over 78 rule pairs, with star vertices carrying up to 2 context legs of each
  type, is joinable within 4 forward steps on each side.'
