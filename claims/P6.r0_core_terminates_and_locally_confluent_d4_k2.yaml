notes: 'The graph-like normalisation core: spider fusion, identity removal with 0/1/2
  Hadamard legs, self-loop removal. Adding hopf_h breaks local confluence at depth
  4 and 6 (see P6.r0_with_hopf_h_locally_confluent_d4_k2 and claims/evidence/p6/r0_cp_depth6_arity2.json).
  Local confluence at bounded residual arity is not local confluence on all hosts:
  the critical-pair lemma for star rules is not established (p6-zx-v1 section 3).'
