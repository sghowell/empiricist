statement: There is an unambiguous passive linear-optical Bell-measurement scheme
  with k=1 ancilla photon(s) on 6 modes (an isometry over the 4 dual-rail input modes
  and 1 ancilla input mode(s)) whose exact per-Bell-state success vector is (phi+,
  phi-, psi+, psi-) = (1/4, 1/4, 1/4, 1/4); hence the problem's p*(1) = sup min_B
  p_B is at least 1/4, and the literature's average-success analogue sup mean_B p_B
  is at least 1/4 (exact evaluation in Q(i)(sqrt d)). Every Bell state is identified
  with positive probability.
