statement: "∀ (mu nu : Empiricist.BellLabel),\n  mu ≠ Empiricist.BellLabel.phiP →\n\
  \    Empiricist.pauliOf mu * Empiricist.pauliOf nu = -(Empiricist.pauliOf nu * Empiricist.pauliOf\
  \ mu) →\n      ∀ (u v : Fin 2 → ℂ),\n        u ≠ 0 →\n          v ≠ 0 →\n      \
  \      ∀ (cu cv : ℂ),\n              (Empiricist.pauliOf mu).mulVec u = cu • u →\n\
  \                (Empiricist.pauliOf mu).mulVec v = cv • v →\n                 \
  \ ¬(sesq u v = 0 ∧ sesq u ((Empiricist.pauliOf nu).mulVec v) = 0)"
