statement: There is an unambiguous passive linear-optical Bell-measurement scheme
  with k=2 ancilla photon(s) on 8 modes (an isometry over the 4 dual-rail input modes
  and 4 ancilla input mode(s)) whose exact per-Bell-state success vector is (phi+,
  phi-, psi+, psi-) = (1/2, 1/2, 1, 1); hence the problem's p*(2) = sup min_B p_B
  is at least 1/2, and the literature's average-success analogue sup mean_B p_B is
  at least 3/4 (exact evaluation in Q(i)(sqrt d)). Every Bell state is identified
  with positive probability.
